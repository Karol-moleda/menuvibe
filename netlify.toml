# Hosting PWA na Netlify – każdy push na GitHub buduje i publikuje nową wersję.
[build]
  command = "npm run build"
  publish = "dist/menuvibe/browser"

[build.environment]
  NODE_VERSION = "24"

# aplikacja jednostronicowa: każdy adres (np. /dzis) serwuje index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# service worker i index muszą być zawsze świeże, żeby aktualizacje docierały od razu
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self)"
